app = "sdet-store-admin"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  # ADMIN_TOKEN  — set via `fly secrets set ADMIN_TOKEN=... -a sdet-store-admin`
  # MAIN_APP_URL — set via `fly secrets set MAIN_APP_URL=https://sdet-store.fly.dev -a sdet-store-admin`

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[http_service.concurrency]
  type = "requests"
  soft_limit = 20
  hard_limit = 50
